name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy pada satu waktu; yang sedang jalan dibiarkan selesai.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Build situs
        run: npm run build

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Unggah dist untuk cek tautan
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  cek:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unduh dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cek tautan dan aset
        run: node scripts/check-links.mjs dist

  deploy:
    needs: [build, cek]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
